name: Quality checks and Onnira package

on:
  push:
    branches:
      - portable-onnira-2026-10-29
      - fix/auth-flow-2026-10-28
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  npm-node-validation:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      VITE_SUPABASE_PROJECT_ID: ci-placeholder
      VITE_PUBLIC_SURVEY_BASE_URL: https://example.invalid
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      HOST: 127.0.0.1
      PORT: 3080
      NITRO_PORT: 3080
    steps:
      - name: Checkout portability branch
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0

      - name: Install npm dependencies and generate package-lock
        run: npm install

      - name: Verify npm lockfile exists
        run: test -s package-lock.json

      - name: Reinstall exactly from npm lockfile
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Production build and TypeScript check
        run: npm run build

      - name: Smoke test Node.js production server
        run: |
          npm run start > /tmp/reichcsat-node.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --silent --show-error --fail http://127.0.0.1:3080/ -o /tmp/reichcsat-home.html; then
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat /tmp/reichcsat-node.log
              exit 1
            fi
            sleep 1
          done
          if [ ! -s /tmp/reichcsat-home.html ]; then
            cat /tmp/reichcsat-node.log
            exit 1
          fi
          grep -q "REICH" /tmp/reichcsat-home.html

      - name: Build clean npm-based Onnira ZIP
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile

          root = Path(".")
          excluded_dirs = {
              ".git", "node_modules", ".output", "dist", "coverage",
              ".cache", ".turbo", ".vite", ".tanstack", "__pycache__",
              ".pytest_cache", ".vercel",
          }
          excluded_files = {".env", "bun.lock", "bunfig.toml"}
          archive = Path("REICHCSAT-ONNIRA.zip")
          included = []

          with ZipFile(archive, "w", compression=ZIP_DEFLATED, compresslevel=9) as output:
              for path in sorted(root.rglob("*")):
                  relative = path.relative_to(root)
                  if any(part in excluded_dirs for part in relative.parts):
                      continue
                  if not path.is_file() or path == archive:
                      continue
                  if path.name in excluded_files:
                      continue
                  if path.name.startswith(".env.") and path.name != ".env.example":
                      continue
                  if path.name in {".DS_Store", "Thumbs.db"}:
                      continue
                  output.write(path, relative.as_posix())
                  included.append(relative.as_posix())

          with ZipFile(archive, "r") as check:
              names = check.namelist()
              assert "package.json" in names, "package.json is missing from ZIP root"
              assert "package-lock.json" in names, "package-lock.json is required by Onnira"
              assert ".env.example" in names, ".env.example should be retained as a template"
              assert "bun.lock" not in names, "Bun lockfile must not be in Onnira ZIP"
              assert "bunfig.toml" not in names, "Bun configuration must not be in Onnira ZIP"
              assert not any(name == ".env" or name.startswith(".env.") and name != ".env.example" for name in names)
              assert not any(any(part in excluded_dirs for part in Path(name).parts) for name in names)
              assert len(names) == len(included), "ZIP verification mismatch"
          print(f"Created {archive} with {len(included)} files ({archive.stat().st_size} bytes).")
          PY

      - name: Upload npm-based Onnira ZIP
        uses: actions/upload-artifact@v4
        with:
          name: REICHCSAT-ONNIRA-NPM
          path: REICHCSAT-ONNIRA.zip
          if-no-files-found: error
          retention-days: 7
