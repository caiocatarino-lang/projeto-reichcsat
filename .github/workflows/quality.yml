name: Quality checks

on:
  push:
    branches:
      - fix/auth-flow-2026-10-28
      - portable-onnira-2026-10-29
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      # Placeholders allow static build/tests without exposing real environment credentials.
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Unit tests
        run: bun run test

      - name: Production build and typecheck
        run: bun run build

      - name: Smoke test Node.js production server
        env:
          HOST: 127.0.0.1
          PORT: 3080
          NITRO_PORT: 3080
        run: |
          bun run start > /tmp/reichcsat-node.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --silent --show-error --fail http://127.0.0.1:3080/ -o /tmp/reichcsat-home.html; then
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat /tmp/reichcsat-node.log
              exit 1
            fi
            sleep 1
          done
          if [ ! -s /tmp/reichcsat-home.html ]; then
            cat /tmp/reichcsat-node.log
            exit 1
          fi
          grep -q "REICH" /tmp/reichcsat-home.html
